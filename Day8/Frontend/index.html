<!doctype html>
<html>
  <head>
    <title>Blog Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Blog Website</h1>
    </header>

    <div class="container">
      <h2>All Blogs</h2>

      <div id="blogContainer"></div>
    </div>
    <div class="container">

      <hr />

      <div id="blogContainer"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
