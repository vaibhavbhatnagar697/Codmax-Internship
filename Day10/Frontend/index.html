<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Blog Website</h1>
    </header>

    <div class="container">
      <h2>Add / Edit Blog</h2>

      <form id="blogForm">
        <input type="text" id="title" placeholder="Enter Blog Title" required />

        <textarea
          id="content"
          placeholder="Enter Blog Content"
          rows="5"
          required
        ></textarea>

        <button type="submit" class="btn">Add Blog</button>

        <button type="button" class="btn" onclick="updateBlog()">
          Update Blog
        </button>
      </form>
    </div>

    <div class="container">
      <h2>All Blogs</h2>

      <div id="blogContainer"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
